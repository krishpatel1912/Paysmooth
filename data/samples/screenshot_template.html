<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    width: 380px;
    box-sizing: border-box;
  }
  .header {
    border-bottom: 1px solid #334155;
    padding-bottom: 16px;
    margin-bottom: 16px;
  }
  .title { font-size: 20px; font-weight: 700; color: #38bdf8; }
  .subtitle { font-size: 13px; color: #94a3b8; margin-top: 4px; }
  .total { font-size: 26px; font-weight: 800; color: #34d399; margin-top: 10px; }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #1e293b;
    font-size: 14px;
  }
  .date { color: #cbd5e1; font-weight: 500; }
  .amount { color: #34d399; font-weight: 700; }
</style>
</head>
<body>
  <div class="header">
    <div class="title">Delivery Partner Portal</div>
    <div class="subtitle">Daily Earnings Statement (May 2025)</div>
    <div class="total">Total: ₹11,350</div>
  </div>
  <div class="list">

    <div class="row"><span class="date">2025-05-07</span><span class="amount">₹650</span></div>
    <div class="row"><span class="date">2025-05-08</span><span class="amount">₹890</span></div>
    <div class="row"><span class="date">2025-05-09</span><span class="amount">₹780</span></div>
    <div class="row"><span class="date">2025-05-10</span><span class="amount">₹920</span></div>
    <div class="row"><span class="date">2025-05-11</span><span class="amount">₹810</span></div>
    <div class="row"><span class="date">2025-05-12</span><span class="amount">₹690</span></div>

</body>
</html>
